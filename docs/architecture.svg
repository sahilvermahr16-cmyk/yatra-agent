<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1150" viewBox="0 0 1400 1150" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
<style>text{font-family:"Segoe UI",Helvetica,Arial,sans-serif;fill:#222} .t{font-size:14px;font-weight:600} .b{font-size:12.5px} .t2{font-size:13px;font-weight:600} .b2{font-size:11.5px} .l{font-size:12px;fill:#555;font-style:italic} .f{font-size:13px;fill:#666} .lf{font-size:11.5px;fill:#3d6b4a}</style></defs>
<rect width="1400" height="1150" fill="#fff"/>
<text x="90" y="32" style="font-size:20px;font-weight:700">yatra-agent · architecture and control flow</text>
<rect x="30" y="118" width="860" height="868" rx="12" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="2,3"/>
<text x="42" y="138" class="f">LangGraph state machine · one shared AgentState (trace, notes and errors are append-only)</text>
<rect x="90" y="48" width="410" height="56" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1.6"/>
<text x="104" y="70" class="t">Goal in plain words</text>
<text x="104" y="88" class="b">python run.py "3 days in Jodhpur, love stepwells, under 20k for two"</text>
<rect x="90" y="160" width="410" height="64" rx="8" fill="#fdebd0" stroke="#c77d12" stroke-width="1.6"/>
<text x="104" y="182" class="t">1 · extract — LLM</text>
<text x="104" y="200" class="b">goal → TripRequest (destination, dates, budget words, wishes)</text>
<text x="104" y="218" class="b">the LLM copies the user's words; code checks them; 1 retry</text>
<rect x="90" y="248" width="410" height="64" rx="8" fill="#e3eefc" stroke="#3a6fb0" stroke-width="1.6"/>
<text x="104" y="270" class="t">2 · normalize — code</text>
<text x="104" y="288" class="b">calendar dates, travellers, budget ceiling / floor;</text>
<text x="104" y="306" class="b">every default is written as a note</text>
<rect x="90" y="336" width="410" height="64" rx="8" fill="#fdebd0" stroke="#c77d12" stroke-width="1.6"/>
<text x="104" y="358" class="t">3 · planner — LLM</text>
<text x="104" y="376" class="b">ordered tool plan, shown before any tool runs;</text>
<text x="104" y="394" class="b">code checks it, 1 retry, else a default plan</text>
<rect x="90" y="424" width="410" height="64" rx="8" fill="#e3eefc" stroke="#3a6fb0" stroke-width="1.6"/>
<text x="104" y="446" class="t">4 · executor — code</text>
<text x="104" y="464" class="b">runs the plan's data steps in order;</text>
<text x="104" y="482" class="b">a failure or unmet wish becomes a note, not a crash</text>
<rect x="90" y="512" width="410" height="64" rx="8" fill="#e3eefc" stroke="#3a6fb0" stroke-width="1.6"/>
<text x="104" y="534" class="t">5 · itinerary — code</text>
<text x="104" y="552" class="b">must-visit → kinds of place → interests → popular;</text>
<text x="104" y="570" class="b">nearby places on one day; rainy days indoors</text>
<rect x="90" y="600" width="410" height="64" rx="8" fill="#e3eefc" stroke="#3a6fb0" stroke-width="1.6"/>
<text x="104" y="622" class="t">6 · stays & day story — code</text>
<text x="104" y="640" class="b">hotel near the next day's places; breakfast, lunch,</text>
<text x="104" y="658" class="b">1 h rest, dinner; timed day; overflow → 'more time'</text>
<rect x="90" y="688" width="410" height="64" rx="8" fill="#e3eefc" stroke="#3a6fb0" stroke-width="1.6"/>
<text x="104" y="710" class="t">7 · budget_check — code</text>
<text x="104" y="728" class="b">total cost vs the user's ceiling / floor</text>
<rect x="560" y="800" width="300" height="120" rx="8" fill="#efe3fb" stroke="#7a46b0" stroke-width="1.6"/>
<text x="574" y="822" class="t">8 · replanner</text>
<text x="574" y="840" class="b">LLM chooses from the allowed changes</text>
<text x="574" y="858" class="b">(each with its exact saving);</text>
<text x="574" y="876" class="b">code applies them, then re-picks the</text>
<text x="574" y="894" class="b">hotel, meals and timeline (step 6) from</text>
<text x="574" y="912" class="b">the saved map data · at most 3 rounds</text>
<rect x="90" y="898" width="410" height="64" rx="8" fill="#e3eefc" stroke="#3a6fb0" stroke-width="1.6"/>
<text x="104" y="920" class="t">9 · reporter — code</text>
<text x="104" y="938" class="b">TripReport (JSON) + Markdown: plan, steps, days,</text>
<text x="104" y="956" class="b">cost, notes, errors handled, assumptions, sources</text>
<rect x="90" y="1016" width="410" height="56" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1.6"/>
<text x="104" y="1038" class="t">Output</text>
<text x="104" y="1056" class="b">samples/*.md · *.json · *.log (console transcript)</text>
