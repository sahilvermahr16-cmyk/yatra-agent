<rect x="930" y="170" width="410" height="78" rx="8" fill="#fdebd0" stroke="#c77d12" stroke-width="1.6"/>
<text x="944" y="192" class="t">gpt-4o-mini · temperature 0</text>
<text x="944" y="210" class="b">structured output (function calling)</text>
<text x="944" y="228" class="b">used by 3 nodes only: extract, planner, replanner</text>
