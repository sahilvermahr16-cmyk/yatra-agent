<rect x="910" y="372" width="450" height="385" rx="12" fill="none" stroke="#3d8b55" stroke-width="1.3" stroke-dasharray="2,3"/>
<text x="922" y="392" class="f">Tools · live, free, no API key</text>
<text x="922" y="412" class="lf">every call: timeout · retry on timeout / 5xx / 429 · trace event · --inject-failure</text>
